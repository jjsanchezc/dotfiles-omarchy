# Respaldo de / y /home al disco Toshiba. Lo ejecuta el comando backup.
timestamp_format        long

# En el disco interno solo queda la última copia (la necesita la siguiente).
snapshot_preserve_min   latest
snapshot_preserve       no

# En el Toshiba: siempre la última, más 14 diarias, 8 semanales y 12 mensuales.
target_preserve_min     latest
target_preserve         14d 8w 12m

volume /mnt/btr_pool
  snapshot_dir btrbk_snapshots
  target /mnt/backup/btrbk
  subvolume @
  subvolume @home
